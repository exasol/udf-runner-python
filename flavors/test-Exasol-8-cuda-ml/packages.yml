build_steps:
- name: conda_deps
  phases:
  - name: install_apt_packages
    apt:
      packages:
      - name: coreutils
        version: '*'
      - name: adduser
        version: '*'
      - name: locales
        version: '*'
      - name: curl
        version: '*'
      - name: ca-certificates
        version: '*'
      - name: bzip2
        version: '*'
      - name: libxml2
        version: '*'
  - name: install_micromamba
    tools:
      micromamba:
        version: 2.5.0-1
        root_prefix: /opt/conda
    variables:
      MAMBA_ROOT_PREFIX: /opt/conda
  validation_cfg:
    version_mandatory: true
- name: udfclient_deps
  phases:
  - name: install_conda_packages
    conda:
      channels:
      - conda-forge
      packages:
      - name: libprotobuf
        version: =*
      - name: zeromq
        version: =*
      - name: nss
        version: =*
      - name: cppzmq
        version: =*
      binary: Micromamba
    variables:
      PROTOBUF_LIBRARY_PREFIX: $MAMBA_ROOT_PREFIX/lib
      PROTOBUF_INCLUDE_PREFIX: $MAMBA_ROOT_PREFIX/include
      ZMQ_LIBRARY_PREFIX: $MAMBA_ROOT_PREFIX/lib
      ZMQ_INCLUDE_PREFIX: $MAMBA_ROOT_PREFIX/include
  validation_cfg:
    version_mandatory: true
- name: language_deps
  phases:
  - name: setup_cuda
    variables:
      # CUDA compatibility ensures that package compiled against older CUDA versions still work.
      CONDA_OVERRIDE_CUDA: '13'
  - name: install_conda_packages
    conda:
      channels:
      - conda-forge
      - nvidia
      packages:
      - name: python
        version: =3.12.*
      - name: numpy
        version: =*
      - name: pandas
        version: =*
      - name: pyarrow
        version: =*
      - name: libarrow
        version: =*=*_cuda
      - name: mamba
        version: =*
      binary: Micromamba
    variables:
      PYTHON3_PREFIX: $MAMBA_ROOT_PREFIX
      PYTHON3_VERSION: python3.12
  - name: configure_tools
    tools:
       mamba_binary_path: /opt/conda/bin/mamba
       python_binary_path: /opt/conda/bin/python3.12
  validation_cfg:
    version_mandatory: true
- name: flavor_base_deps
  phases:
  - name: install_apt_packages
    apt:
      packages:
      - name: tzdata
        version: '*'
  - name: install_conda_packages
    conda:
      channels:
      - conda-forge
      - nvidia
      packages:
      - name: cudnn
        version: =*
      - name: cuda-toolkit
        version: =*
      - name: cuda-nvcc
        version: =*
      - name: cuda-nvrtc
        version: =*
      - name: numba
        version: =*
      - name: numba-cuda
        version: =*
      - name: pytorch
        version: =*=cuda130_generic_py312_*
      binary: Mamba
  validation_cfg:
    version_mandatory: true
version: =*
