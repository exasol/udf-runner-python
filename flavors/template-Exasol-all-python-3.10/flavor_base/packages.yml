build_steps:
- name: base_test_deps
  phases:
  - name: install_apt_packages
    apt:
      packages:
      - name: gdb
        version: '*'
      - name: valgrind
        version: '*'
      - name: gdbserver
        version: '*'
      - name: binutils
        version: '*'
      - name: patchelf
        version: '*'
      - name: strace
        version: '*'
  validation_cfg:
    version_mandatory: true
- name: build_deps
  phases:
  - name: install_apt_packages
    apt:
      packages:
      - name: git
        version: '*'
      - name: coreutils
        version: '*'
      - name: locales
        version: '*'
      - name: tar
        version: '*'
      - name: curl
        version: '*'
      - name: openjdk-11-jdk-headless
        version: '*'
      - name: ca-certificates
        version: '*'
      - name: build-essential
        version: '*'
      - name: libpcre3-dev
        version: '*'
      - name: protobuf-compiler
        version: '*'
      - name: chrpath
        version: '*'
    variables:
      PROTOBUF_BIN: /usr/bin/protoc
  - name: install_bazel
    tools:
      bazel:
        version: '8.3.1'
  validation_cfg:
    version_mandatory: true
- name: security_scan
  phases:
  - name: install_deps
    apt:
      packages:
        - name: gnupg
  - name: install_trivy
    apt:
      repos:
        trivy:
          key_url: https://aquasecurity.github.io/trivy-repo/deb/public.key
          entry: deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb
            generic main
          out_file: trivy.list
      packages:
        - name: trivy
  validation_cfg:
    version_mandatory: false
version: '*'
