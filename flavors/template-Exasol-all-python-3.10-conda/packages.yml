build_steps:
- name: conda_deps
  phases:
  - name: install_apt_packages
    apt:
      packages:
      - name: coreutils
        version: '*'
      - name: locales
        version: '*'
      - name: curl
        version: '*'
      - name: ca-certificates
        version: '*'
      - name: bzip2
        version: '*'
      - name: libxml2
        version: '*'
  - name: install_micromamba
    tools:
      micromamba:
        version: 2.5.0-1
        root_prefix: /opt/conda
    variables:
      MAMBA_ROOT_PREFIX: /opt/conda
  validation_cfg:
    version_mandatory: true
- name: udfclient_deps
  phases:
  - name: install_conda_packages
    conda:
      channels:
      - conda-forge
      packages:
      - name: libprotobuf
        version: =*
      - name: zeromq
        version: =*
      - name: nss
        version: =*
      - name: cppzmq
        version: =*
      binary: Micromamba
    variables:
      PROTOBUF_LIBRARY_PREFIX: $MAMBA_ROOT_PREFIX/lib
      PROTOBUF_INCLUDE_PREFIX: $MAMBA_ROOT_PREFIX/include
      ZMQ_LIBRARY_PREFIX: $MAMBA_ROOT_PREFIX/lib
      ZMQ_INCLUDE_PREFIX: $MAMBA_ROOT_PREFIX/include
  validation_cfg:
    version_mandatory: true
- name: language_deps
  phases:
  - name: install_conda_packages
    conda:
      channels:
      - conda-forge
      packages:
      - name: python
        version: =3.10.*
      - name: numpy
        version: =2.2.6
      - name: pandas
        version: =2.3.3
      - name: pyarrow
        version: =24.0.0
      - name: mamba
        version: =*
      binary: Micromamba
    variables:
      PYTHON3_PREFIX: $MAMBA_ROOT_PREFIX
      PYTHON3_VERSION: python3.10
  - name: configure_tools
    tools:
     mamba_binary_path: /opt/conda/bin/mamba
     python_binary_path: /opt/conda/bin/python3.10
  validation_cfg:
    version_mandatory: true
- name: flavor_base_deps
  phases:
  - name: install_apt_packages
    apt:
      packages:
      - name: tzdata
        version: '*'
  - name: install_conda_packages
    conda:
      channels:
      - conda-forge
      packages: []
      binary: Mamba
  validation_cfg:
    version_mandatory: true
- name: flavor_customization
  phases:
  - name: setup_pip
    tools:
      pip:
        version: '21.3.1'
        needs_break_system_packages: false
  - name: install_conda_packages
    conda:
      channels:
      - conda-forge
      packages: []
#        - name: cuda-compat
#          version: =12.9.1
      binary: Mamba
  - name: install_pip_packages
    pip:
      packages: []
#        - name: tensorflow-probability
#          version: =0.9.0
  validation_cfg:
    version_mandatory: false
version: 1.0.0
